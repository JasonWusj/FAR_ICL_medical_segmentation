name: Static checks (no experiments)
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.8
      - run: python scripts/static_check.py
      - run: ruff check far_icl scripts tests
      - run: ruff format --check far_icl scripts tests
